name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  windows:
    name: Windows installer (install / skip / upgrade)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install, re-run (must skip), bump VERSION, re-run (must upgrade)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $v = (Get-Content VERSION -Raw).Trim()
          .\setup-agy-harness.ps1
          $agents = Join-Path $env:USERPROFILE "AGENTS.md"
          $c = Get-Content $agents -Raw
          # NOTE: keep this inline script pure ASCII. GitHub writes it to a temp .ps1 without BOM,
          # and Windows PowerShell 5.1 then mangles any non-ASCII literal into a parse error.
          if ($c -notlike "*<!-- agy-harness:begin v$v -->*Files-On-Demand*view_file*<!-- agy-harness:end -->*") { throw "v$v block missing after install" }
          if (-not (Test-Path (Join-Path $env:USERPROFILE ".gemini\bin\agy-safe.ps1"))) { throw "agy-safe.ps1 not installed" }

          $out = .\setup-agy-harness.ps1 | Out-String
          if ($out -notlike "*[~]*v$v*") { throw "second run did not skip: $out" }

          Set-Content VERSION -Value "99.0.0" -NoNewline
          $out = .\setup-agy-harness.ps1 | Out-String
          if ($out -notlike "*v$v -> v99.0.0*") { throw "upgrade path did not replace block: $out" }
          $c = Get-Content $agents -Raw
          if (([regex]::Matches($c, "agy-harness:begin")).Count -ne 1) { throw "duplicate blocks after upgrade" }
          if ($c -notlike "*begin v99.0.0*") { throw "block version not bumped" }
          Write-Host "Windows installer: install / skip / upgrade all OK"

  unix:
    name: Bash installer (install / skip / upgrade)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install, re-run (must skip), bump VERSION, re-run (must upgrade)
        run: |
          set -e
          v=$(tr -d '[:space:]' < VERSION)
          bash setup-agy-harness.sh
          grep -q "<!-- agy-harness:begin v$v -->" ~/AGENTS.md
          grep -q "OneDrive 與雲端隨選檔案" ~/.gemini/GEMINI.md
          bash setup-agy-harness.sh | grep -q "略過"
          printf '99.0.0' > VERSION
          bash setup-agy-harness.sh | grep -q "v$v -> v99.0.0"
          [ "$(grep -c 'agy-harness:begin' ~/AGENTS.md)" = "1" ]
          grep -q "begin v99.0.0" ~/AGENTS.md
          echo "Bash installer: install / skip / upgrade all OK"
